name: Android signed dev build

on:
  workflow_dispatch:

jobs:
  signed-dev-apk:
    runs-on: ubuntu-latest
    permissions:
      code: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Cache Gradle downloads
        uses: actions/cache@v4.1.2
        with:
          path: |
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/wrapper/dists
          key: gradle-v1-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-v1-${{ runner.os }}-
      - name: Check CFI runtime
        run: |
          npm ci --prefix tools/reader-cfi-runtime
          npm run check --prefix tools/reader-cfi-runtime
      - name: Build, verify, and package signed APK
        id: package
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          SECOND_PASS_RELEASE_STORE_PASSWORD: ${{ secrets.SECOND_PASS_RELEASE_STORE_PASSWORD }}
          SECOND_PASS_RELEASE_KEY_ALIAS: ${{ secrets.SECOND_PASS_RELEASE_KEY_ALIAS }}
          SECOND_PASS_RELEASE_KEY_PASSWORD: ${{ secrets.SECOND_PASS_RELEASE_KEY_PASSWORD }}
        run: bash tools/release/build-signed-apk.sh
      - name: Upload signed dev artifacts
        uses: https://github.com/christopherhx/gitea-upload-artifact@v4
        with:
          name: second-pass-reader-${{ steps.package.outputs.version_name }}-dev
          path: |
            build/release-artifacts/*.apk
            build/release-artifacts/*.apk.sha256
          if-no-files-found: error
