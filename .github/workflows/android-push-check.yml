name: Android push test kit

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - '**'

jobs:
  push-test-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Set up Android SDK
        run: bash tools/ci/setup-android-sdk.sh
      - name: Cache Gradle downloads
        uses: actions/cache@v4.1.2
        with:
          path: |
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/wrapper/dists
          key: gradle-v1-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-v1-${{ runner.os }}-
      - name: Check CFI runtime
        run: |
          npm ci --prefix tools/reader-cfi-runtime
          npm run check --prefix tools/reader-cfi-runtime
      - name: Run fast test kit
        run: |
          node --test tools/release/*.test.mjs
          bash ./gradlew check
